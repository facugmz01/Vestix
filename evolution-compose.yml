services:
  evolution-db:
    image: postgres:15-alpine
    container_name: evolution-db
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution_user
      POSTGRES_PASSWORD: evolution_password_secure_change_me
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - evolution-net
    restart: always

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    networks:
      - evolution-net
    restart: always

  # If outbound messages appear in Manager but stay PENDING / never reach phones
  # even with correct 549… numbers, update this image (Baileys tctoken fixes) or
  # pin a release newer than 2.3.7 / 2.4.0 with baileys >= 7.0.0-rc13.
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    depends_on:
      - evolution-db
      - evolution-redis
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=replace-me-with-a-secure-key-123
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution_user:evolution_password_secure_change_me@evolution-db:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_CONN=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_LOCAL_ENABLED=false
    networks:
      - evolution-net
    restart: always

  # Port 3001 conflicts with Vestix backend locally — change host port if needed.
  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution-manager
    ports:
      - "3001:80"
    entrypoint: ["/bin/sh", "-c", "sed -i 's/ must-revalidate//g' /etc/nginx/conf.d/nginx.conf && exec /start.sh"]
    networks:
      - evolution-net
    restart: always

networks:
  evolution-net:
    driver: bridge

volumes:
  evolution_db_data:
  evolution_instances:
